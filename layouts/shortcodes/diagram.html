{{ $base := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
<figure>
  <img class="diagram-light" src="/diagrams/{{ $base }}-light.svg" alt="{{ $alt }}" loading="lazy">
  <img class="diagram-dark" src="/diagrams/{{ $base }}-dark.svg" alt="" aria-hidden="true" loading="lazy">
  {{ with .Get "caption" }}<figcaption><small>{{ . }}</small></figcaption>{{ end }}
</figure>
